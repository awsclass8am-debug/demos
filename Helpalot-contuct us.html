<script>
function submitContact() {

  const data = new FormData();

  data.append("entry.2005620554", document.getElementById("full-name").value);
  data.append("entry.1045781291", document.getElementById("email").value);
  data.append("entry.839337160", document.getElementById("message").value);

  fetch("https://docs.google.com/forms/d/e/1FAIpQLScI1o_r4wMfIDZ40T9yyczFWQphUk7tlRd-B_ePFz2OHDCZ6A/formResponse", {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  // clear
  document.getElementById("full-name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("message").value = "";

  // popup
  const popup = document.getElementById("popup");
  popup.style.display = "flex";

  setTimeout(() => {
    popup.style.display = "none";
  }, 3000);
}
</script>

<script>
let lastScroll = 0;
const nav = document.querySelector('.navbar');

window.addEventListener('scroll', () => {
    let currentScroll = window.pageYOffset;

    if (currentScroll > lastScroll) {
        // scrolling down → hide
        nav.classList.add('hide');
        nav.classList.remove('show');
    } else {
        // scrolling up → show
        nav.classList.add('show');
        nav.classList.remove('hide');
    }

    lastScroll = currentScroll;
});
window.location='Helpalot-thanks.html';

</script>
